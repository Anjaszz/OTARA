<ion-header class="ion-no-border">
  <ion-toolbar class="bg-transparent">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/masuk" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="min-h-full flex flex-col justify-center px-4">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-[#59AC77] to-[#4a9666] rounded-full mx-auto mb-4 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Lupa Password?</h1>
      <p class="text-gray-600 text-sm">Masukkan email Anda dan kami akan mengirimkan kode OTP untuk reset password</p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <!-- Email Input -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </div>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="nama@email.com"
            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#59AC77] focus:border-transparent outline-none transition-all"
            [disabled]="isLoading"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button
        (click)="sendOTP()"
        [disabled]="isLoading || !email"
        class="w-full bg-gradient-to-r from-[#59AC77] to-[#4a9666] text-white py-3 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading">Kirim Kode OTP</span>
        <span *ngIf="isLoading" class="flex items-center justify-center">
          <svg class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Mengirim...
        </span>
      </button>
    </div>

    <!-- Back to Login -->
    <div class="text-center">
      <a (click)="goToLogin()" class="text-[#59AC77] font-medium text-sm cursor-pointer hover:underline">
        Kembali ke halaman login
      </a>
    </div>
  </div>
</ion-content>
