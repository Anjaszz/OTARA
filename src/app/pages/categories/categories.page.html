<ion-header >
    <ion-toolbar color="primary">
    </ion-toolbar>
</ion-header>

<div class=" flex items-center p-6  bg-gray-50 header-costum">
  <!-- Icon di kiri -->
  <div class="p-2 bg-[#F2F2F7] rounded-full h-12 w-12" routerLink="/dashboard">
    <ic-cheveron-right />
  </div>

  <!-- Text di tengah -->
  <div class="absolute left-1/2 transform -translate-x-1/2 bg-[#F2F2F7] py-4 px-14 rounded-full font-medium">
    Kategori
  </div>
</div>
<ion-content class="bg-gray-50">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-8">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Categories Grid -->
  <div *ngIf="!isLoading" class="p-4">
    <div class="grid grid-cols-3 gap-4">
      <div
        *ngFor="let category of categories"
        (click)="selectCategory(category)"
        class="category-card flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-2 flex-shrink-0">
          <img [src]="getCategoryImage(category.nama)" [alt]="category.nama" class="w-16 h-16 object-contain">
        </div>
        <p class="text-xs font-semibold text-gray-800 text-center line-clamp-2 leading-tight">{{ category.nama }}</p>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="categories.length === 0" class="text-center py-8">
      <p class="text-gray-500">Belum ada kategori</p>
    </div>
  </div>
</ion-content>
