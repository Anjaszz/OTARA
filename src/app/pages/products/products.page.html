<ion-header class="header-custom">
  <div class="header-content">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back" class="text-white text-xl"></ion-icon>
    </button>
    <h1 class="header-title">Semua Produk</h1>
    <button class="filter-btn" (click)="toggleFilters()">
      <ion-icon name="funnel-outline" class="text-white text-xl"></ion-icon>
    </button>
  </div>
</ion-header>

<ion-content class="content-custom">
  <div class="container">

    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-wrapper">
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          placeholder="Cari produk..."
          class="search-input">
        <button *ngIf="searchQuery" (click)="clearSearch()" class="clear-btn">
          <ion-icon name="close-circle" class="text-gray-400"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Filter Panel -->
    <div *ngIf="showFilters" class="filter-panel">
      <!-- Sort Filter -->
      <div class="filter-group">
        <label class="filter-label">Urutkan</label>
        <div class="filter-chips">
          <button
            (click)="selectSort('terbaru')"
            [class]="selectedSort === 'terbaru' ? 'chip-active' : 'chip'">
            Terbaru
          </button>
          <button
            (click)="selectSort('termurah')"
            [class]="selectedSort === 'termurah' ? 'chip-active' : 'chip'">
            Termurah
          </button>
          <button
            (click)="selectSort('termahal')"
            [class]="selectedSort === 'termahal' ? 'chip-active' : 'chip'">
            Termahal
          </button>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="filter-group">
        <label class="filter-label">Kategori</label>
        <div *ngIf="isLoadingCategories" class="text-center py-2">
          <ion-spinner name="crescent"></ion-spinner>
        </div>
        <div *ngIf="!isLoadingCategories" class="filter-chips">
          <button
            *ngFor="let category of categories"
            (click)="selectCategory(category.nama)"
            [class]="selectedCategory === category.nama ? 'chip-active' : 'chip'">
            {{ category.nama }}
          </button>
        </div>
      </div>

      <!-- Clear All Filters -->
      <button (click)="clearAllFilters()" class="clear-filters-btn">
        Reset Filter
      </button>
    </div>

    <!-- Result Info -->
    <div class="result-info">
      <p class="result-text">{{ totalProducts }} Produk ditemukan</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-section">
      <ion-spinner name="crescent"></ion-spinner>
      <p class="loading-text">Memuat produk...</p>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!isLoading" class="products-grid">
      <div
        *ngFor="let product of products"
        class="product-card"
        (click)="viewProductDetail(product._id)">
        <div class="product-image-wrapper">
          <img [src]="getProductImage(product)" [alt]="product.nama" class="product-image">
        </div>
        <div class="product-info">
          <h3 class="product-name">{{ product.nama }}</h3>
          <p class="product-price">Rp {{ product.harga | number }}</p>
          <p class="product-seller">{{ getSellerName(product) }}</p>
          <div class="product-location">
            <svg class="location-icon" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
            </svg>
            <span class="location-text">{{ getSellerLocation(product) }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && products.length === 0" class="empty-state">
      <div class="empty-icon">📦</div>
      <p class="empty-title">Produk tidak ditemukan</p>
      <p class="empty-text">Coba ubah kata kunci atau filter pencarian Anda</p>
      <button (click)="clearAllFilters()" class="empty-btn">Reset Filter</button>
    </div>

  </div>
</ion-content>
