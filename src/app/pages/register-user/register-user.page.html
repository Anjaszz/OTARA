<ion-header>
  <ion-toolbar color="primary">
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="flex flex-col min-h-full bg-surface-drop px-6 py-8 text-text-subtle">

    <!-- Back Button -->
    <div class="p-2 bg-[#F2F2F7] w-fit rounded-full h-12 w-12 cursor-pointer" routerLink="/on-boarding">
      <ic-cheveron-right />
    </div>

    <!-- Title -->
    <div class="mt-8 mb-6">
      <h1 class="text-3xl font-bold text-gray-900">Daftar Pengguna</h1>
      <p class="text-gray-600 mt-2">Buat akun untuk mulai berbelanja</p>
    </div>

    <!-- Register Form -->
    <div class="mb-6">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Nama Lengkap -->
        <div class="space-y-2">
          <label class="text-gray-700 font-medium text-sm">Nama Lengkap</label>
          <input
            formControlName="nama"
            type="text"
            placeholder="Masukkan nama lengkap"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
            [class.border-red-500]="nama?.invalid && nama?.touched">
          <div *ngIf="nama?.invalid && nama?.touched" class="text-red-500 text-xs mt-1">
            <span *ngIf="nama?.errors?.['required']">Nama wajib diisi</span>
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label class="text-gray-700 font-medium text-sm">Email</label>
          <input
            formControlName="email"
            type="email"
            placeholder="contoh@email.com"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
            [class.border-red-500]="email?.invalid && email?.touched">
          <div *ngIf="email?.invalid && email?.touched" class="text-red-500 text-xs mt-1">
            <span *ngIf="email?.errors?.['required']">Email wajib diisi</span>
            <span *ngIf="email?.errors?.['email']">Format email tidak valid</span>
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="text-gray-700 font-medium text-sm">Password</label>
          <div class="relative">
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Masukkan password"
              class="w-full pl-4 pr-12 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
              [class.border-red-500]="password?.invalid && password?.touched">
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg *ngIf="!showPassword" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
            </button>
          </div>
          <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-xs mt-1">
            <span *ngIf="password?.errors?.['required']">Password wajib diisi</span>
            <span *ngIf="password?.errors?.['minlength']">Password minimal 6 karakter</span>
          </div>
        </div>

        <!-- Terms and Conditions -->
        <div class="flex items-start space-x-3 pt-2">
          <input
            type="checkbox"
            formControlName="setujuSyarat"
            class="mt-1 h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded">
          <div class="text-sm">
            <label class="text-gray-600">
              Saya setuju dengan <span class="text-emerald-600 hover:text-emerald-700 font-medium">syarat dan ketentuan</span>
              yang berlaku
            </label>
          </div>
        </div>

        <!-- Register Button -->
        <button
          type="submit"
          [disabled]="!registerForm.valid || isLoading"
          class="w-full bg-[#59AC77] hover:bg-[#499c68] text-white font-semibold py-3 px-6 rounded-full transition-colors duration-200 flex items-center justify-center mt-6 disabled:bg-gray-400 disabled:cursor-not-allowed">
          <ion-spinner *ngIf="isLoading" name="crescent" class="mr-2"></ion-spinner>
          <span *ngIf="!isLoading">Daftar Sekarang</span>
          <span *ngIf="isLoading">Sedang mendaftar...</span>
        </button>
      </form>
    </div>

    <!-- Toggle Between Login and Register -->
    <div class="p-1 bg-[#F2F2F7] rounded-full w-full flex mt-auto relative overflow-hidden">
      <div class="w-full p-4 text-center rounded-full cursor-pointer transition-all duration-300 ease-in-out hover:bg-[#E8E8ED] z-10" routerLink="/masuk">
        Masuk
      </div>
      <div class="p-4 w-full text-center bg-[#59AC77] rounded-full text-white font-medium transition-all duration-300 ease-in-out z-10">
        Daftar
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    position="top"
    (didDismiss)="showToast = false">
  </ion-toast>
</ion-content>
