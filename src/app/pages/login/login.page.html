<ion-header>
  <ion-toolbar color="primary">
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="flex flex-col min-h-full bg-surface-drop px-6 py-8 text-text-subtle">
    
    <!-- Logo and Welcome Section -->
    <div class="p-2 bg-[#F2F2F7] w-fit rounded-full h-12 w-12" routerLink="/on-boarding">
     <ic-cheveron-right   />
    </div>

    <!-- Login Form -->
    <div class=" mb-6 mt-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Email or Phone Field -->
        <div class="space-y-2">
          <label class="text-gray-700 font-medium text-sm">Email atau Nomor Telepon</label>
          <div class="relative">

            <input
              formControlName="emailOrPhone"
              type="text"
              placeholder="Masukkan email atau nomor telepon"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
              [class.border-red-500]="emailOrPhone?.invalid && emailOrPhone?.touched">
          </div>
          <div *ngIf="emailOrPhone?.invalid && emailOrPhone?.touched" class="text-red-500 text-xs mt-1">
            <span *ngIf="emailOrPhone?.errors?.['required']">Email atau nomor telepon wajib diisi</span>
            <span *ngIf="emailOrPhone?.errors?.['emailOrPhone']">Format email atau nomor telepon tidak valid</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label class="text-gray-700 font-medium text-sm">Password</label>
          <div class="relative">
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Masukkan password Anda"
              class="w-full pl-4 pr-12 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
              [class.border-red-500]="password?.invalid && password?.touched">
            <button 
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg *ngIf="!showPassword" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
            </button>
          </div>
          <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-xs mt-1">
            <span *ngIf="password?.errors?.['required']">Password wajib diisi</span>
            <span *ngIf="password?.errors?.['minlength']">Password minimal 6 karakter</span>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
         <div class="flex gap-1">
          <span class="text-text-bolder text-sm font-medium">Lupa Password?</span>
          <button 
          type="button" 
          (click)="forgotPassword()"
          class="text-blue-600 text-sm font-medium hover:text-blue-700">
          Pulihkan
        </button>
         </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          [disabled]="isLoading"
          class="w-full bg-[#59AC77] hover:bg-[#499c68] text-white font-semibold py-3 px-6 rounded-full transition-colors duration-200 flex items-center justify-center mt-6">
          <ion-spinner *ngIf="isLoading" name="crescent" class="mr-2"></ion-spinner>
          <span *ngIf="!isLoading">Masuk</span>
          <span *ngIf="isLoading">Sedang masuk...</span>
        </button>
      </form>
      
    </div>

    <!-- Toggle Between Login and Register -->
    <div class="p-1 bg-[#F2F2F7] rounded-full w-full flex mt-auto relative overflow-hidden">
      <div class="p-4 w-full text-center bg-[#59AC77] rounded-full text-white font-medium transition-all duration-300 ease-in-out z-10">
        Masuk
      </div>
      <div class="w-full p-4 text-center rounded-full cursor-pointer transition-all duration-300 ease-in-out hover:bg-[#E8E8ED] z-10" routerLink="/on-boarding">
        Daftar
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    position="top"
    (didDismiss)="showToast = false">
  </ion-toast>
</ion-content>
