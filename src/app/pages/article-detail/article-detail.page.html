<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white">
    <ion-buttons slot="start">
      <button (click)="goBack()" class="p-2">
        <ion-icon name="arrow-back" class="text-2xl text-gray-800"></ion-icon>
      </button>
    </ion-buttons>
    <ion-buttons slot="end">
      <button (click)="shareArticle()" class="p-2">
        <ion-icon name="share-outline" class="text-xl text-gray-800"></ion-icon>
      </button>
      <button (click)="bookmarkArticle()" class="p-2">
        <ion-icon name="bookmark-outline" class="text-xl text-gray-800"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" class="bg-white">
  <div *ngIf="article" class="min-h-screen bg-white">
    <!-- Article Image -->
    <div class="w-full h-64 bg-gray-100 overflow-hidden">
      <img [src]="article.image" [alt]="article.title" class="w-full h-full object-cover">
    </div>

    <!-- Article Content -->
    <div class="px-4 py-6">
      <!-- Category Badge -->
      <div class="mb-3">
        <span class="inline-block bg-green-100 text-green-700 text-xs font-medium px-3 py-1 rounded-full">
          {{ article.category }}
        </span>
      </div>

      <!-- Title -->
      <h1 class="text-2xl font-bold text-gray-900 mb-3">{{ article.title }}</h1>

      <!-- Meta Info -->
      <div class="flex items-center text-gray-500 text-sm mb-6">
        <span>{{ article.author }}</span>
        <span class="mx-2">•</span>
        <span>{{ article.date }}</span>
      </div>

      <!-- Summary -->
      <div class="mb-6">
        <p class="text-gray-600 text-base leading-relaxed">{{ article.summary }}</p>
      </div>

      <!-- Divider -->
      <div class="border-t border-gray-200 mb-6"></div>

      <!-- Article Content -->
      <div class="article-content text-gray-800 leading-relaxed" [innerHTML]="article.content"></div>
    </div>

    <!-- Related Articles Section (Optional) -->
    <div class="px-4 py-6 bg-gray-50 mt-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Artikel Terkait</h2>
      <div class="text-center text-gray-500 py-4">
        <p class="text-sm">Belum ada artikel terkait</p>
      </div>
    </div>
  </div>

  <!-- Article Not Found -->
  <div *ngIf="!article" class="flex items-center justify-center h-full">
    <div class="text-center">
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Artikel Tidak Ditemukan</h2>
      <p class="text-gray-600 mb-4">Artikel yang Anda cari tidak tersedia</p>
      <button (click)="goBack()" class="bg-green-600 text-white px-6 py-2 rounded-full">
        Kembali
      </button>
    </div>
  </div>
</ion-content>
