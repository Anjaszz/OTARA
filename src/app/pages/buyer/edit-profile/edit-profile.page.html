<ion-header class="ion-no-border">
  <ion-toolbar class="bg-[#59AC77]">
    <ion-buttons slot="start">
      <button (click)="goBack()" class="p-2">
        <ion-icon name="arrow-back" class="text-2xl text-white"></ion-icon>
      </button>
    </ion-buttons>
    <div class="text-white font-semibold text-lg">Edit Profil</div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray-50">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-screen">
    <ion-spinner name="crescent" class="text-[#59AC77]"></ion-spinner>
  </div>

  <!-- Edit Form -->
  <div *ngIf="!isLoading && buyer" class="min-h-full">
    <div class="px-4 py-6">
      <!-- Avatar Preview Card -->
      <div class="bg-white rounded-2xl shadow-sm mb-4 overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-100">
          <h3 class="text-base font-semibold text-gray-800">Preview Avatar</h3>
        </div>
        <div class="flex flex-col items-center py-6">
          <div class="relative mb-3">
            <img
              [src]="'https://ui-avatars.com/api/?name=' + (nama || 'User') + '&background=ffffff&color=59AC77&size=200'"
              [alt]="nama"
              class="w-24 h-24 rounded-full border-4 border-gray-100 shadow-md"
            />
          </div>
          <p class="text-xs text-gray-500">Avatar akan berubah sesuai nama</p>
        </div>
      </div>

      <!-- Form Card -->
      <div class="bg-white rounded-2xl shadow-sm mb-4 overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-100">
          <h3 class="text-base font-semibold text-gray-800">Informasi Profil</h3>
        </div>

        <div class="p-5 space-y-5">
          <!-- Name Input -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Nama Lengkap <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <ion-icon name="person" class="text-gray-400 text-lg"></ion-icon>
              </div>
              <input
                type="text"
                [(ngModel)]="nama"
                placeholder="Masukkan nama lengkap"
                [disabled]="isSaving"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#59AC77] focus:border-[#59AC77] outline-none transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
              />
            </div>
            <p class="text-xs text-gray-500 mt-1.5">Nama akan ditampilkan pada profil Anda</p>
          </div>

          <!-- Email (Read-only) -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Email
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <ion-icon name="mail" class="text-gray-400 text-lg"></ion-icon>
              </div>
              <input
                type="email"
                [value]="buyer.email"
                disabled
                class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-500 cursor-not-allowed"
              />
            </div>
            <p class="text-xs text-gray-500 mt-1.5">Email tidak dapat diubah</p>
          </div>
        </div>
      </div>

      <!-- Info Box -->
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0">
            <ion-icon name="information-circle" class="text-blue-500 text-xl"></ion-icon>
          </div>
          <div class="flex-1">
            <p class="text-sm text-blue-800 leading-relaxed">
              Pastikan nama yang Anda masukkan sesuai dengan identitas asli Anda untuk memudahkan transaksi.
            </p>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-3 mb-6">
        <!-- Save Button -->
        <button
          (click)="saveProfile()"
          [disabled]="isSaving || !nama || nama.trim() === ''"
          class="w-full bg-[#59AC77] hover:bg-[#4a9666] active:bg-[#3d7d55] disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
        >
          <ion-spinner *ngIf="isSaving" name="crescent" class="text-white"></ion-spinner>
          <ion-icon *ngIf="!isSaving" name="checkmark-circle" class="text-xl"></ion-icon>
          <span>{{ isSaving ? 'Menyimpan...' : 'Simpan Perubahan' }}</span>
        </button>

        <!-- Cancel Button -->
        <button
          (click)="goBack()"
          [disabled]="isSaving"
          class="w-full bg-white hover:bg-gray-50 active:bg-gray-100 disabled:bg-gray-100 disabled:cursor-not-allowed text-gray-700 font-medium py-3.5 rounded-xl border-2 border-gray-200 transition-all flex items-center justify-center gap-2"
        >
          <ion-icon name="close-circle" class="text-xl"></ion-icon>
          <span>Batal</span>
        </button>
      </div>
    </div>
  </div>
</ion-content>
