<ion-header class="ion-no-border">
  <ion-toolbar class="bg-[#59AC77]">
    <ion-buttons slot="start">
      <button (click)="goBack()" class="p-2">
        <ion-icon name="arrow-back" class="text-2xl text-white"></ion-icon>
      </button>
    </ion-buttons>
    <div class="text-white font-semibold text-lg">Profil Saya</div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray-50">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-screen">
    <ion-spinner name="crescent" class="text-[#59AC77]"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && buyer" class="min-h-full">
    <!-- Profile Header Card -->
    <div class="bg-gradient-to-br from-[#59AC77] to-[#4a9666] px-6 pt-6 pb-8 rounded-b-3xl shadow-lg">
      <div class="flex flex-col items-center">
        <!-- Avatar -->
        <div class="relative mb-4">
          <img
            [src]="'https://ui-avatars.com/api/?name=' + buyer.nama + '&background=ffffff&color=59AC77&size=200'"
            [alt]="buyer.nama"
            class="w-28 h-28 rounded-full border-4 border-white shadow-lg"
          />
          <div *ngIf="buyer.isVerified" class="absolute bottom-0 right-0 bg-blue-500 rounded-full p-1.5 border-4 border-white">
            <ion-icon name="checkmark" class="text-white text-sm"></ion-icon>
          </div>
        </div>

        <!-- Name & Email -->
        <h2 class="text-2xl font-bold text-white mb-1">{{ buyer.nama }}</h2>
        <p class="text-white/90 text-sm mb-4">{{ buyer.email }}</p>

        <!-- Edit Button -->
        <button
          (click)="editProfile()"
          class="bg-white text-[#59AC77] px-6 py-2.5 rounded-full font-medium text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-2"
        >
          <ion-icon name="create-outline" class="text-lg"></ion-icon>
          Edit Profil
        </button>
      </div>
    </div>

    <div class="px-4 py-6">
      <!-- Account Information -->
      <div class="bg-white rounded-2xl shadow-sm mb-4 overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-100">
          <h3 class="text-base font-semibold text-gray-800">Informasi Akun</h3>
        </div>

        <div class="p-5 space-y-4">
          <!-- Name -->
          <div class="flex items-start gap-4">
            <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center flex-shrink-0">
              <ion-icon name="person" class="text-blue-600 text-xl"></ion-icon>
            </div>
            <div class="flex-1">
              <p class="text-xs text-gray-500 mb-0.5">Nama Lengkap</p>
              <p class="text-sm font-medium text-gray-800">{{ buyer.nama }}</p>
            </div>
          </div>

          <!-- Email -->
          <div class="flex items-start gap-4">
            <div class="w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center flex-shrink-0">
              <ion-icon name="mail" class="text-purple-600 text-xl"></ion-icon>
            </div>
            <div class="flex-1">
              <p class="text-xs text-gray-500 mb-0.5">Email</p>
              <p class="text-sm font-medium text-gray-800">{{ buyer.email }}</p>
            </div>
          </div>

          <!-- Verification Status -->
          <div class="flex items-start gap-4">
            <div
              class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
              [class]="buyer.isVerified ? 'bg-green-50' : 'bg-gray-50'"
            >
              <ion-icon
                name="checkmark-circle"
                class="text-xl"
                [class]="buyer.isVerified ? 'text-green-600' : 'text-gray-400'"
              ></ion-icon>
            </div>
            <div class="flex-1">
              <p class="text-xs text-gray-500 mb-0.5">Status Verifikasi</p>
              <p
                class="text-sm font-medium"
                [class]="buyer.isVerified ? 'text-green-600' : 'text-gray-600'"
              >
                {{ buyer.isVerified ? 'Terverifikasi' : 'Belum Terverifikasi' }}
              </p>
            </div>
          </div>

          <!-- Account Created -->
          <div class="flex items-start gap-4">
            <div class="w-10 h-10 bg-orange-50 rounded-full flex items-center justify-center flex-shrink-0">
              <ion-icon name="calendar" class="text-orange-600 text-xl"></ion-icon>
            </div>
            <div class="flex-1">
              <p class="text-xs text-gray-500 mb-0.5">Akun Dibuat</p>
              <p class="text-sm font-medium text-gray-800">{{ buyer.createdAt | date:'dd MMMM yyyy' }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Logout Button -->
      <button
        (click)="logout()"
        [disabled]="isLoggingOut"
        class="w-full bg-red-500 hover:bg-red-600 active:bg-red-700 disabled:bg-gray-300 text-white font-medium py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mb-6"
      >
        <ion-spinner *ngIf="isLoggingOut" name="crescent" class="text-white"></ion-spinner>
        <ion-icon *ngIf="!isLoggingOut" name="log-out" class="text-xl"></ion-icon>
        <span>{{ isLoggingOut ? 'Logging out...' : 'Keluar' }}</span>
      </button>

      <!-- App Version -->
      <div class="text-center py-4">
        <p class="text-xs text-gray-400">UMKM Naik Kelas v1.0.0</p>
      </div>
    </div>
  </div>
</ion-content>
